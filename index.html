<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>hi-4 — Shooting Game</title>
  <style>
    html,body { height:100%; margin:0; background:#0f1724; color:#fff; font-family:Arial, sans-serif; }
    #gameCanvas { display:block; background:#1a2a4a; }
    #hud { position:fixed; left:10px; top:10px; z-index:20; width:260px; }
    #health { width:220px; height:18px; background:#333; border-radius:4px; overflow:hidden; margin-bottom:6px; }
    #health-fill { height:100%; width:100%; background:#ff4444; }
    #health-text { font-size:12px; margin-bottom:6px; }
    #ammo-count { font-weight:bold; }
    #items-list { background:rgba(0,0,0,0.3); padding:6px; border-radius:6px; }
    #minimap { position:fixed; right:10px; top:10px; z-index:20; width:150px; height:150px; background:#111; border-radius:6px; padding:6px; box-sizing:border-box; }
    #start-screen, #game-over-screen { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); padding:20px; border-radius:8px; z-index:30; text-align:center; }
    .hidden { display:none; }
    button { padding:8px 14px; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="health"><div id="health-fill"></div></div>
    <div id="health-text">100/100</div>
    Ammo: <span id="ammo-count">30</span>
    <div id="items-list"></div>
  </div>

  <div id="minimap"></div>

  <div id="start-screen" class="">
    <h2>hi-4</h2>
    <p>A shooting game</p>
    <button onclick="startGame()">Start</button>
  </div>

  <div id="game-over-screen" class="hidden">
    <h2>Game Over</h2>
    <p id="game-stats"></p>
    <button onclick="location.reload()">Reload</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
